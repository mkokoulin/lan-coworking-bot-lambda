# Most required config comes from env vars set on the Gradle `test` task (see build.gradle.kts) —
# those reliably beat both the repo's `.env` file and application.yml defaults.
# telegram.api-base-url is a literal (non-env-driven) value in application.yml, so it can only be
# overridden here or per-test via a WireMockBackendResource config override.
%test.telegram.api-base-url=http://localhost:0

# @Scheduled jobs fire immediately on boot; disabled globally so they don't pollute
# WireMock request counts or make stray network calls during unrelated tests.
# Batch tests covering EventCapacityAlertScheduler/EventNotificationScheduler invoke
# their methods directly instead of relying on the trigger.
%test.quarkus.scheduler.enabled=false
