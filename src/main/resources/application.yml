quarkus:
  http:
    port: 8088
  rest-client:
    telegram-api:
      url: https://api.telegram.org
    "com.lan.app.client.baserow.api.CoworkingGuestsApi":
      url: ${BASEROW_URL:http://localhost:8080}
    "com.lan.app.client.baserow.api.CoworkingTariffsApi":
      url: ${BASEROW_URL:http://localhost:8080}
    "com.lan.app.client.baserow.api.CoworkingMeetingRoomBookingsApi":
      url: ${BASEROW_URL:http://localhost:8080}
    "com.lan.app.client.baserow.api.CoworkingActiveTariffsApi":
      url: ${BASEROW_URL:http://localhost:8080}
    "com.lan.app.client.baserow.api.CoworkingNotificationsApi":
      url: ${BASEROW_URL:http://localhost:8080}
  default-locale: en
  locales:
    - en
    - ru
  openapi-generator:
    codegen:
      spec:
        baserow_api_json:
          base-package: com.lan.app.client.baserow
    baserow_api_json:
      auth:
        bearerAuth:
          bearer-token: ${BASEROW_TOKEN:}
  log:
    console:
      json: false
      color: true
      format: "%d{HH:mm:ss} %-5p [%c{2.}] %s%e%n"

telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN}
  admin-chat-id: ${TELEGRAM_ADMIN_CHAT_ID}
  api-base-url: https://api.telegram.org

app:
  site-url: ${SITE_URL:}
  backend-url: ${BACKEND_URL:}
  baserow-url: ${BASEROW_URL:http://localhost:8080}
  baserow-token: ${BASEROW_TOKEN:}
  wifi-guest-ssid: ${WIFI_GUEST_SSID:}
  wifi-guest-password: ${WIFI_GUEST_PASSWORD:}
  wifi-private-ssid: ${WIFI_PRIVATE_SSID:}
  wifi-private-password: ${WIFI_PRIVATE_PASSWORD:}

"%dev":
  quarkus:
    devservices:
      enabled: false

  baserow:
    token: ${BASEROW_TOKEN:}
