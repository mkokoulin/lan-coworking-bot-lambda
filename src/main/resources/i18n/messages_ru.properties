# --- coworking flow ---
coworking_intro=\uD83D\uDCBC Letters & Numbers \u2014 \u043A\u043E\u0432\u043E\u0440\u043A\u0438\u043D\u0433, \u0431\u0430\u0440 \u0438 \u043C\u0435\u0440\u043E\u043F\u0440\u0438\u044F\u0442\u0438\u044F \u0432 \u0446\u0435\u043D\u0442\u0440\u0435 \u0415\u0440\u0435\u0432\u0430\u043D\u0430.\n\u0425\u043E\u0447\u0435\u0442\u0441\u044F \u043F\u043E\u043F\u0440\u043E\u0431\u043E\u0432\u0430\u0442\u044C? \u041D\u0430\u0447\u043D\u0438\u0442\u0435 \u0441 /booking \u2014 \u0442\u0430\u043C \u0435\u0441\u0442\u044C \u043F\u0440\u0438\u044F\u0442\u043D\u044B\u0439 \u043F\u0435\u0440\u0432\u044B\u0439 \u0432\u0438\u0437\u0438\u0442 \uD83D\uDE09
coworking_prices=\uD83D\uDCB3 \u0422\u0430\u0440\u0438\u0444\u044B \u043A\u043E\u0432\u043E\u0440\u043A\u0438\u043D\u0433\u0430:\n\u2022 1 \u0447\u0430\u0441 \u2014 1\u00A0300\u058F\n\u2022 4 \u0447\u0430\u0441\u0430 \u2014 3\u00A0000\u058F\n\u2022 1 \u0434\u0435\u043D\u044C \u2014 5\u00A0000\u058F\n\u2022 7 \u0434\u043D\u0435\u0439 \u2014 25\u00A0000\u058F (20\u00A0000\u058F \u043F\u0440\u043E\u0434\u043B\u0435\u043D\u0438\u0435)\n\u2022 30 \u0434\u043D\u0435\u0439 \u2014 75\u00A0000\u058F (60\u00A0000\u058F \u043F\u0440\u043E\u0434\u043B\u0435\u043D\u0438\u0435)\n\u2022 LAN+ (60 \u0434\u043D\u0435\u0439) \u2014 120\u00A0000\u058F (96\u00A0000\u058F \u043F\u0440\u043E\u0434\u043B\u0435\u043D\u0438\u0435)
coworking_meeting=\uD83E\uDDD1\u200D\uD83D\uDCBC \u041F\u0435\u0440\u0435\u0433\u043E\u0432\u043E\u0440\u043D\u0430\u044F (\u0434\u043E 6 \u0447\u0435\u043B\u043E\u0432\u0435\u043A), \u0446\u0435\u043D\u0430 \u0437\u0430 1 \u0447\u0430\u0441:\n\u2022 \u00AB1+1\u00BB \u2014 3\u00A0500\u058F\n\u2022 \u00AB\u0434\u043E 6 \u0447\u0435\u043B\u043E\u0432\u0435\u043A\u00BB \u2014 5\u00A0000\u058F\n\u2022 \u0414\u043B\u044F \u0440\u0435\u0437\u0438\u0434\u0435\u043D\u0442\u043E\u0432 (\u0434\u043E\u043F. \u0447\u0430\u0441\u044B) \u2014 2\u00A0000\u058F\n<i>\u0421\u043A\u0438\u0434\u043A\u0430 \u043F\u0440\u0438 \u0431\u0440\u043E\u043D\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u0438 \u043E\u0442 5 \u0447\u0430\u0441\u043E\u0432. \u0411\u0440\u043E\u043D\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u0435 \u043A\u0440\u0430\u0442\u043D\u043E 30 \u043C\u0438\u043D\u0443\u0442.</i>
coworking_options=\u2728 \u041E\u043F\u0446\u0438\u0438 \u043A\u043E\u0432\u043E\u0440\u043A\u0438\u043D\u0433\u0430:\n\u2022 \u0427\u0430\u0441\u044B \u0440\u0430\u0431\u043E\u0442\u044B: \u0431\u0443\u0434\u043D\u0438 10:00\u201322:00, \u0432\u044B\u0445\u043E\u0434\u043D\u044B\u0435 10:00\u201316:00\n\u2022 \u0411\u0435\u0437\u043B\u0438\u043C\u0438\u0442\u043D\u044B\u0439 \u0444\u0438\u043B\u044C\u0442\u0440-\u043A\u043E\u0444\u0435 \u0438\u043B\u0438 \u0447\u0430\u0439\n\u2022 \u0411\u044B\u0441\u0442\u0440\u044B\u0439 \u0438\u043D\u0442\u0435\u0440\u043D\u0435\u0442 ~200 Mbit/s\n\u2022 \u041A\u043E\u043D\u0434\u0438\u0446\u0438\u043E\u043D\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u0435, \u0435\u0441\u0442\u0435\u0441\u0442\u0432\u0435\u043D\u043D\u043E\u0435 \u0438 \u0438\u0441\u043A\u0443\u0441\u0441\u0442\u0432\u0435\u043D\u043D\u043E\u0435 \u043E\u0441\u0432\u0435\u0449\u0435\u043D\u0438\u0435\n\u2022 \u0423\u0434\u043E\u0431\u043D\u043E\u0435 \u0440\u0430\u0441\u043F\u043E\u043B\u043E\u0436\u0435\u043D\u0438\u0435 \u0432 \u0446\u0435\u043D\u0442\u0440\u0435, \u0441\u043E\u0431\u0441\u0442\u0432\u0435\u043D\u043D\u044B\u0439 \u0434\u0432\u043E\u0440-\u0441\u0430\u0434\n\u2022 \u0417\u043E\u043D\u044B \u0434\u043B\u044F \u043E\u0431\u0435\u0434\u0430; specialty coffee, caf\u00E9 & bar\n\u2022 \u041F\u0435\u0440\u0435\u0433\u043E\u0432\u043E\u0440\u043D\u0430\u044F; \u0441\u043E\u043E\u0431\u0449\u0435\u0441\u0442\u0432\u043E \u0438 \u0441\u043E\u0431\u044B\u0442\u0438\u044F\n\u2022 \u0423\u043B\u0438\u0447\u043D\u044B\u0435 \u0442\u0435\u0440\u0440\u0430\u0441\u044B \u0434\u043B\u044F \u0440\u0430\u0431\u043E\u0442\u044B\n\u2022 \u0425\u0440\u0430\u043D\u0435\u043D\u0438\u0435 \u0431\u0430\u0433\u0430\u0436\u0430\n\u2022 \u041B\u044E\u0431\u044B\u0435 \u0441\u043F\u043E\u0441\u043E\u0431\u044B \u043E\u043F\u043B\u0430\u0442\u044B (\u043D\u0430\u043B/\u043A\u0430\u0440\u0442\u0430/\u0441\u0447\u0451\u0442)\n\u2022 \u0421\u043F\u0435\u0446\u0443\u0441\u043B\u